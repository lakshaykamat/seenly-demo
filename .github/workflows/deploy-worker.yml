name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "Dockerfile"
      - "docker-compose.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/seenly-worker" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}:latest
        with:
          host: ${{ secrets.WORKER_HOST }}
          username: ${{ secrets.WORKER_USER }}
          key: ${{ secrets.WORKER_SSH_KEY }}
          envs: REGISTRY_TOKEN,GITHUB_ACTOR,IMAGE
          script: |
            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            docker pull $IMAGE
            docker stop seenly-worker 2>/dev/null || true
            docker rm seenly-worker 2>/dev/null || true
            docker run -d \
              --name seenly-worker \
              --restart unless-stopped \
              --env-file /opt/seenly/.env \
              --cpus="1" \
              --memory="1g" \
              $IMAGE
            docker image prune -f
